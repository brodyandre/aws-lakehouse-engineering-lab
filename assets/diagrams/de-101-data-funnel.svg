<svg xmlns="http://www.w3.org/2000/svg" width="1160" height="410" viewBox="0 0 1160 410" role="img" aria-labelledby="title description">
  <title id="title">Funil de qualidade de dados do incidente DE-101</title>
  <desc id="description">Dos 1.000 itens da camada Silver, 30 são excluídos por quantidade inválida, deixando 970. Outros 33 itens pertencem a pedidos com status inválido e são excluídos, deixando 937 registros na tabela de vendas Gold. A exclusão de 63 registros foi explicada pelas regras de qualidade.</desc>
  <rect width="1160" height="410" rx="20" fill="#f8fafc"/>
  <text x="52" y="51" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="700" fill="#0f172a">Para onde foram os 63 registros?</text>
  <text x="52" y="80" font-family="Arial, Helvetica, sans-serif" font-size="15" fill="#475569">Investigação DE-101 | dados sintéticos | regras aplicadas entre Silver e Gold</text>
  <g font-family="Arial, Helvetica, sans-serif">
    <rect x="52" y="117" width="295" height="159" rx="14" fill="#e0f2fe" stroke="#0284c7" stroke-width="2"/>
    <text x="76" y="155" font-size="17" font-weight="700" fill="#075985">SILVER</text>
    <text x="76" y="220" font-size="56" font-weight="700" fill="#0c4a6e">1.000</text>
    <text x="76" y="247" font-size="15" fill="#0c4a6e">itens preservados</text>

    <rect x="433" y="117" width="295" height="159" rx="14" fill="#fef3c7" stroke="#d97706" stroke-width="2"/>
    <text x="457" y="155" font-size="17" font-weight="700" fill="#92400e">APÓS VALIDAR QUANTIDADE</text>
    <text x="457" y="220" font-size="56" font-weight="700" fill="#78350f">970</text>
    <text x="457" y="247" font-size="15" fill="#78350f">itens com quantidade válida</text>

    <rect x="813" y="117" width="295" height="159" rx="14" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
    <text x="837" y="155" font-size="17" font-weight="700" fill="#166534">GOLD: FCT_SALES</text>
    <text x="837" y="220" font-size="56" font-weight="700" fill="#14532d">937</text>
    <text x="837" y="247" font-size="15" fill="#14532d">linhas elegíveis para análise</text>

    <path d="M350 198 H427" stroke="#64748b" stroke-width="3" fill="none"/>
    <path d="M416 190 L429 198 L416 206" stroke="#64748b" stroke-width="3" fill="none"/>
    <text x="388" y="174" font-size="15" font-weight="700" text-anchor="middle" fill="#b45309">-30</text>
    <path d="M730 198 H807" stroke="#64748b" stroke-width="3" fill="none"/>
    <path d="M796 190 L809 198 L796 206" stroke="#64748b" stroke-width="3" fill="none"/>
    <text x="768" y="174" font-size="15" font-weight="700" text-anchor="middle" fill="#b45309">-33</text>

    <rect x="52" y="300" width="1056" height="70" rx="11" fill="#e2e8f0"/>
    <text x="74" y="326" font-size="16" font-weight="700" fill="#0f172a">Resultado: as 63 exclusões (6,3%) foram rastreadas.</text>
    <text x="74" y="351" font-size="14" fill="#334155">30 quantidades inválidas + 33 itens vinculados a 12 pedidos com status inválido. Nenhuma perda extra nos joins seguintes.</text>
    <text x="52" y="398" font-size="12" fill="#64748b">Fonte: docs/incidents/de-101-raw-silver-divergence.md. Visualização de uma investigação de laboratório, não de uma operação em produção.</text>
  </g>
</svg>